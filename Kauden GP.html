<!DOCTYPE html>
<html lang="fi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Kauden GP</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6e8eb;--panel:#fff;--ink:#14171b;--muted:#5b6068;--line:#c8ccd2;--red:#d7262e;--yellow:#ffd400;--purple:#9b3fd6;--green:#1f9d3a;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1e22;--panel:#26292f;--ink:#eef0f2;--muted:#a2a7af;--line:#3a3e45;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1e22;--panel:#26292f;--ink:#eef0f2;--muted:#a2a7af;--line:#3a3e45;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Titillium Web",system-ui,-apple-system,sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas#c{position:fixed;inset:0;display:block}
#menu{position:fixed;inset:0;overflow-y:auto;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 18px) 16px calc(env(safe-area-inset-bottom,0px) + 30px);touch-action:pan-y;z-index:20}
#menu.hide,.hide{display:none!important}
.wrap{max-width:720px;margin:0 auto}
.logo{font-weight:900;font-style:italic;font-size:clamp(44px,11vw,84px);line-height:.9;letter-spacing:-.02em;margin:10px 0 4px;display:flex;align-items:flex-end;gap:12px}
.logo .stripe{display:inline-block;width:18px;height:.85em;background:repeating-linear-gradient(180deg,var(--red) 0 10px,#fff 10px 20px);transform:skewX(-14deg);border:1px solid var(--line)}
.sub{color:var(--muted);font-size:17px;margin:0 0 22px}
h2{font-size:28px;font-weight:900;font-style:italic;margin:6px 0 12px}
h3{font-size:18px;margin:20px 0 8px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.seg button,.btn{font:inherit;font-weight:700;font-size:17px;border:2px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:10px 16px;cursor:pointer;min-height:46px}
.seg button.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.btn.go{background:var(--red);border-color:var(--red);color:#fff;font-size:20px;padding:14px 26px;transform:skewX(-8deg)}
.btn.go span{display:inline-block;transform:skewX(8deg)}
.btn:focus-visible,.seg button:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.mode{text-align:left;padding:16px;border:2px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;font:inherit;cursor:pointer}
.mode b{display:block;font-size:22px;font-style:italic;font-weight:900}
.mode small{color:var(--muted);font-size:15px}
.cal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cal button{font:inherit;text-align:left;padding:10px 12px;border:2px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;cursor:pointer}
.cal button small{display:block;color:var(--muted)}
.cal button.done{opacity:.55}
.cal button.next{border-color:var(--red)}
table{width:100%;border-collapse:collapse;font-size:16px;background:var(--panel)}
td,th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--muted);font-weight:600;font-size:14px}
td.n{text-align:right;font-variant-numeric:tabular-nums}
tr.me td{background:color-mix(in srgb,var(--yellow) 30%,transparent)}
.dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:7px;vertical-align:middle}
.tyre{display:inline-flex;width:30px;height:30px;border-radius:50%;border:5px solid;align-items:center;justify-content:center;font-weight:900;font-size:13px;background:#1b1b1b;color:#fff}
.tyrebtn{display:flex;align-items:center;gap:8px}
input[type=text]{font:inherit;font-size:18px;padding:9px 12px;border:2px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);width:min(260px,100%)}
.note{color:var(--muted);font-size:15px;max-width:60ch}
.purple{color:var(--purple);font-weight:700}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5;color:#fff;text-shadow:0 1px 2px #000a}
#tower{position:absolute;left:calc(env(safe-area-inset-left,0px) + 8px);top:calc(env(safe-area-inset-top,0px) + 8px);background:#101317d9;border-radius:6px;padding:6px 0;min-width:150px;font-size:14px;text-shadow:none}
#tower .h{padding:0 10px 4px;font-weight:900;font-style:italic;font-size:16px}
#tower .r{display:flex;gap:6px;padding:1px 10px;align-items:center}
#tower .r.me{background:#ffd40044}
#tower .r .p{width:18px;text-align:right;font-weight:700}
#tower .r .g{margin-left:auto;font-variant-numeric:tabular-nums;color:#c8ccd2}
#tower .bar{width:3px;height:14px}
#info{position:absolute;right:calc(env(safe-area-inset-right,0px) + 8px);top:calc(env(safe-area-inset-top,0px) + 8px);display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#mini{background:#101317b3;border-radius:6px}
.chip{background:#101317d9;border-radius:6px;padding:4px 10px;font-size:15px;text-shadow:none;font-variant-numeric:tabular-nums}
.chip b{font-size:20px}
#speed{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);text-align:center;background:#101317d9;border-radius:8px;padding:4px 16px;text-shadow:none}
#speed b{font-size:34px;font-weight:900;font-style:italic;font-variant-numeric:tabular-nums}
#banner{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);transform:translateX(-50%) skewX(-8deg);font-weight:900;font-style:italic;font-size:clamp(15px,2.6vw,22px);padding:4px 14px;max-width:46vw;overflow:hidden;text-overflow:ellipsis;background:#101317e6;border-left:8px solid var(--yellow);white-space:nowrap;opacity:0;transition:opacity .25s}
#banner.show{opacity:1}
#lights{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 52px);transform:translateX(-50%);display:flex;gap:6px;background:#111;padding:6px 8px;border-radius:6px}
#lights i{width:18px;height:18px;border-radius:50%;background:#333;display:block}
#lights i.on{background:#ff2020;box-shadow:0 0 18px #f00}
/* touch */
#touch{position:fixed;inset:0;z-index:6;pointer-events:none}
.tb{position:absolute;pointer-events:auto;border-radius:50%;background:#ffffff2e;border:2px solid #ffffff66;color:#fff;font:900 22px "Titillium Web",sans-serif;display:flex;align-items:center;justify-content:center;touch-action:none}
.tb.down{background:#ffffff6b}
#tl{left:calc(env(safe-area-inset-left,0px) + 18px);bottom:calc(env(safe-area-inset-bottom,0px) + 24px);width:92px;height:92px}
#tr{left:calc(env(safe-area-inset-left,0px) + 124px);bottom:calc(env(safe-area-inset-bottom,0px) + 24px);width:92px;height:92px}
#tg{right:calc(env(safe-area-inset-right,0px) + 18px);bottom:calc(env(safe-area-inset-bottom,0px) + 24px);width:104px;height:104px;background:#1f9d3a66}
#tbk{right:calc(env(safe-area-inset-right,0px) + 132px);bottom:calc(env(safe-area-inset-bottom,0px) + 24px);width:84px;height:84px;background:#d7262e66}
#topbtns{position:fixed;z-index:7;right:calc(env(safe-area-inset-right,0px) + 8px);bottom:calc(env(safe-area-inset-bottom,0px) + 150px);display:flex;flex-direction:column;gap:8px}
#topbtns button{font:900 18px "Titillium Web",sans-serif;width:54px;height:54px;border-radius:8px;border:2px solid #fff8;background:#101317cc;color:#fff}
#pitbtn.req{background:var(--yellow);color:#000}
#overlay{position:fixed;inset:0;z-index:30;background:#0009;display:flex;align-items:center;justify-content:center;padding:16px}
#overlay .box{background:var(--panel);color:var(--ink);border-radius:10px;padding:20px;max-width:440px;width:100%;max-height:90%;overflow:auto;touch-action:pan-y}
@media (max-width:640px){#tower{font-size:12px;min-width:120px}#tower .h{font-size:14px}}
@media (prefers-reduced-motion:reduce){#banner{transition:none}}

    teams:[['Rosso Moto','#c8102e','#ffffff'],['Blu Racing','#1846c8','#9fd3ff'],['Arancia','#ff6a00','#111111'],['Verde','#1d9a46','#f5f5f5'],['Nero','#222428','#ffd400'],['Argento','#b9bec6','#1e5bd8'],['Viola','#6d2bd6','#ff4fa0'],['Ciano','#00a6b8','#ffffff']]}

const TR={
sakhir:{n:'Bahrain',p:[[10,80],[70,80],[85,70],[80,55],[60,55],[50,45],[65,35],[85,30],[90,15],[60,10],[30,15],[20,35],[30,50],[15,60]],rain:.03},

mugello:{n:'Mugello',p:[[10,50],[30,20],[60,15],[90,30],[80,50],[90,70],[65,85],[45,70],[25,85]],rain:.3},

};
function cr(a,b,c,d,u){const u2=u*u,u3=u2*u;return [0.5*(2*b[0]+(-a[0]+c[0])*u+(2*a[0]-5*b[0]+4*c[0]-d[0])*u2+(-a[0]+3*b[0]-3*c[0]+d[0])*u3),0.5*(2*b[1]+(-a[1]+c[1])*u+(2*a[1]-5*b[1]+4*c[1]-d[1])*u2+(-a[1]+3*b[1]-3*c[1]+d[1])*u3)];}
function buildTrack(key){
 const t=TR[key],S=42,P=t.p.map(q=>[q[0]*S,q[1]*S]),n=P.length,raw=[];
 for(let i=0;i<n;i++){const a=P[(i-1+n)%n],b=P[i],c=P[(i+1)%n],d=P[(i+2)%n];const st=Math.max(6,Math.round(Math.hypot(c[0]-b[0],c[1]-b[1])/5));for(let s=0;s<st;s++)raw.push(cr(a,b,c,d,s/st));}
 let pts=raw;
 for(let it=0;it<30;it++){pts=pts.map((p,i)=>{const A=pts[(i-1+pts.length)%pts.length],B=pts[(i+1)%pts.length];return[(A[0]+2*p[0]+B[0])/4,(A[1]+2*p[1]+B[1])/4];});}
 const cum=[0];for(let i=1;i<=pts.length;i++){const A=pts[i-1],B=pts[i%pts.length];cum.push(cum[i-1]+Math.hypot(B[0]-A[0],B[1]-A[1]));}
 const L=cum[pts.length],STEP=10,N=Math.floor(L/STEP),x=new Float32Array(N),y=new Float32Array(N);let k=0;
 for(let i=0;i<N;i++){const d=i*L/N;while(cum[k+1]<d)k++;const A=pts[k],B=pts[(k+1)%pts.length],f=(d-cum[k])/(cum[k+1]-cum[k]||1);x[i]=A[0]+(B[0]-A[0])*f;y[i]=A[1]+(B[1]-A[1])*f;}
 const step=L/N,nx=new Float32Array(N),ny=new Float32Array(N),tg=new Float32Array(N),kv=new Float32Array(N);
 for(let i=0;i<N;i++){const a=(i-1+N)%N,b=(i+1)%N;tg[i]=Math.atan2(y[b]-y[a],x[b]-x[a]);nx[i]=-Math.sin(tg[i]);ny[i]=Math.cos(tg[i]);}
 for(let i=0;i<N;i++){let d=tg[(i+3)%N]-tg[(i-3+N)%N];while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;kv[i]=Math.abs(d)/(6*step);}
 return {key,name:t.n,rain:t.rain,N,x,y,nx,ny,tg,kv,step,L};
}


const TRK={};function getTrack(k){return TRK[k]||(TRK[k]=buildTrack(k))}
function makeProfile(T,C){const N=T.N,v=new Float32Array(N);
 for(let i=0;i<N;i++)v[i]=Math.min(C.top,Math.sqrt(C.lat/Math.max(T.kv[i],1e-4)));
 for(let p=0;p<2;p++)for(let i=N-1;i>=0;i--){const n=v[(i+1)%N];v[i]=Math.min(v[i],Math.sqrt(n*n+2*C.brake*.8*T.step))}
 const fw=v.slice();for(let p=0;p<2;p++)for(let i=0;i<N;i++){const q=fw[(i-1+N)%N];fw[i]=Math.min(fw[i],Math.sqrt(q*q+2*C.acc*.7*T.step))}
 let lap=0;for(let i=0;i<N;i++)lap+=T.step/Math.max(30,fw[i]);return{v,lap}}

function roster(cls){const R=ROSTER[cls],base=[.86,.915,.96][S.diff];
 const list=R.names.map((n,i)=>{const t=R.teams[i%8];return{name:n,code:n.split(' ').pop().normalize('NFD').replace(/[^A-Za-z]/g,'').slice(0,3).toUpperCase(),team:t[0],col:t[1],col2:t[2],skill:base+.045*(1-i/14)}});
 list.push({name:S.name||'Pelaaja',code:'SIN',team:'Oma talli',col:'#ffd400',col2:'#d7262e',skill:1,isP:true});return list}

/* ---------- AUDIO ---------- */
const AU={ctx:null};
function auInit(){if(AU.ctx)return;try{const A=window.AudioContext||window.webkitAudioContext,c=new A();AU.ctx=c;
 AU.m=c.createGain();AU.m.gain.value=S.sound?.55:0;AU.m.connect(c.destination);
 const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=900;lp.Q.value=2.5;lp.connect(AU.m);AU.lp=lp;
 AU.eg=c.createGain();AU.eg.gain.value=0;AU.eg.connect(lp);
 AU.o1=c.createOscillator();AU.o1.type='sawtooth';AU.o2=c.createOscillator();AU.o2.type='triangle';const g2=c.createGain();g2.gain.value=.7;
 AU.o4=c.createOscillator();AU.o4.type='sine';const g4=c.createGain();g4.gain.value=.9;AU.o4.connect(g4);g4.connect(AU.eg);AU.o4.start();
 AU.o1.connect(AU.eg);AU.o2.connect(g2);g2.connect(AU.eg);AU.o1.start();AU.o2.start();
 AU.og=c.createGain();AU.og.gain.value=0;AU.o3=c.createOscillator();AU.o3.type='sawtooth';AU.o3.connect(AU.og);AU.og.connect(lp);AU.o3.start();

   h+='<div class="r'+(c.isP?' me':'')+'"><span class="p">'+pos+'</span><span class="bar" style="background:'+c.col+'"></span><span>'+c.code+'</span><span class="tyre" style="width:14px;height:14px;border-width:3px;border-color:'+TY[c.tyre].col+'"></span><span class="g">'+gap+'</span></div>'})}
 else{h='<div class="h">'+(G.mode==='quali'?'Aika-ajo':'Ennätysajo')+'</div>';const rows=G.mode==='quali'?W8.qAI.concat([{code:'SIN',t:p.best,isP:1,col:'#ffd400'}]).sort((a,b)=>a.t-b.t):[{code:'Paras',t:p.best,isP:1,col:'#ffd400'},{code:'Ennätys',t:store.get('kgp_tt_'+G.cls+'_'+G.key,Infinity),col:'#9b3fd6'}];
  rows.forEach((r,i)=>{if(i<10||r.isP)h+='<div class="r'+(r.isP?' me':'')+'"><span class="p">'+(i+1)+'</span><span class="bar" style="background:'+r.col+'"></span><span>'+r.code+'</span><span class="g">'+fmt(r.t)+'</span></div>'})}
 $('#tower').innerHTML=h;
 if(p){$('#lapchip').innerHTML=G.mode==='race'?'P<b>'+(ord.indexOf(p)+1)+'</b>/'+ord.length+' &nbsp;Kierros <b>'+clamp(p.lap+1,1,G.laps)+'</b>/'+G.laps:'Kierroksia '+p.lapsDone;
  $('#timechip').innerHTML=(p.lap<0&&G.mode!=='race'?'Lähtökierros ':'Kierros ')+fmt(G.count>0?0:Math.max(0,G.t-p.lapStart))+'<br>Edell. '+fmt(p.last||Infinity)+'<br>Paras '+fmt(p.best)+(G.fast.t<Infinity&&G.mode==='race'?'<br><span class="purple">'+fmt(G.fast.t)+'</span>':'');
  const ty=TY[p.tyre];$('#tyrechip').innerHTML='<span class="tyrebtn"><span class="tyre" style="border-color:'+ty.col+'">'+p.tyre+'</span>'+Math.round((1-p.wear)*100)+'%'+(p.punct?' <b style="color:#ff5a5a">RIKKI</b>':'')+(p.dmg>.15?' vauriot '+Math.round(p.dmg*100)+'%':'')+'</span>';}
 $('#wxchip').textContent=(G.rainNow>.1?'🌧 Sade':'☀ Pouta')+' · rata '+(G.wet<.15?'kuiva':G.wet<.45?'kostea':'märkä')+(G.sc&&G.sc.on?' · TURVA-AUTO':'');
 const mc=$('#mini'),q=mc.getContext('2d'),[a0,a1,b0,b1]=T.bb,s=Math.min(136/(a1-a0),96/(b1-b0)),ox=75-(a0+a1)/2*s,oy=55-(b0+b1)/2*s;q.clearRect(0,0,150,110);q.strokeStyle='#e6e8eb';q.lineWidth=3;q.beginPath();for(let i=0;i<=T.N;i+=4){const j=i%T.N;q.lineTo(ox+T.x[j]*s,oy+T.y[j]*s)}q.closePath();q.stroke();
 q.fillStyle='#fff';q.fillRect(ox+T.x[0]*s-1,oy+T.y[0]*s-4,3,8);if(G.pitLane){const pl=G.pitLane;q.strokeStyle='#ffd400';q.lineWidth=2;q.beginPath();for(let k=pl.i0;k<=pl.i1;k+=3){const i=k%T.N;q.lineTo(ox+(T.x[i]+T.nx[i]*pl.lat)*s,oy+(T.y[i]+T.ny[i]*pl.lat)*s)}q.stroke()}
 for(const c of G.cars){if(c.state==='pit')continue;q.fillStyle=c.isP?'#ffd400':c.col;q.beginPath();q.arc(ox+c.x*s,oy+c.y*s,c.isP?4.5:3,0,7);q.fill()}
 if(G.sc&&G.sc.on){const i=Math.floor(G.sc.idx)%T.N;q.fillStyle='#ff9900';q.fillRect(ox+T.x[i]*s-3,oy+T.y[i]*s-3,6,6)}}
let bT=null;function banner(t,d){const b=$('#banner');b.textContent=t;b.classList.add('show');clearTimeout(bT);bT=setTimeout(()=>b.classList.remove('show'),(d||2)*1000)}
let lastT=0;
function loop(ts){requestAnimationFrame(loop);if(!G||!G.running)return;let dt=Math.min(.05,(ts-lastT)/1000);lastT=ts;if(dt<=0)return;
 if(!G.paused){const n=3;for(let i=0;i<n;i++)step(dt/n)}render(G.paused?0:dt);hud(dt);audioTick()}

/* ---------- OVERLAYS ---------- */
function overlay(html){$('#obox').innerHTML=html;$('#overlay').classList.remove('hide')}
function closeOv(){$('#overlay').classList.add('hide')}
function togglePause(){if(G.paused){G.paused=false;closeOv();lastT=performance.now();return}G.paused=true;
 overlay('<h2>Tauko</h2><p class="note">Näppäimet: nuolet tai WASD, välilyönti jarru, P varikko, C kamera, M äänet.</p><div class="row"><button class="btn go" id="oRes"><span>Jatka</span></button><button class="btn" id="oCam">Kamera</button><button class="btn" id="oSnd">Äänet '+(S.sound?'päällä':'pois')+'</button><button class="btn" id="oQuit">'+(G.mode==='race'?'Keskeytä kisa':'Lopeta')+'</button></div>');
 $('#oRes').onclick=togglePause;$('#oCam').onclick=()=>{cycleCam()};$('#oSnd').onclick=e=>{setSound(!S.sound);e.target.textContent='Äänet '+(S.sound?'päällä':'pois')};
 $('#oQuit').onclick=()=>{closeOv();if(G.mode==='race'){G.player.state='out';endSession(true)}else endSession()}}
function openPit(){if(G.player.done||G.player.state!=='run')return;G.paused=true;const p=G.player;
 overlay('<h2>Varikko</h2><p class="note">Valitse renkaat. Lähtösuoran lopussa käänny keltaisesta P-kyltistä varikkokaistalle ja pysähdy valkoiseen ruutuun automaattisesti. Rata: '+(G.wet<.15?'kuiva':G.wet<.45?'kostea':'märkä')+'. Nykyiset: '+TY[p.tyre].n+', kulunut '+Math.round(p.wear*100)+' %.</p><div class="seg">'+G.C.tyres.map(t=>'<button data-t="'+t+'" class="tyrebtn'+(p.pitReq===t?' on':'')+'"><span class="tyre" style="border-color:'+TY[t].col+'">'+t+'</span>'+TY[t].n+'</button>').join('')+'</div><div class="row"><button class="btn" id="oNo">'+(p.pitReq?'Peru varikkokäynti':'Takaisin')+'</button></div>');
 document.querySelectorAll('#obox [data-t]').forEach(b=>b.onclick=()=>{p.pitReq=b.dataset.t;$('#pitbtn').classList.add('req');banner('Varikolle tällä kierroksella',2);G.paused=false;closeOv();lastT=performance.now()});
 $('#oNo').onclick=()=>{if(p.pitReq){p.pitReq=null;$('#pitbtn').classList.remove('req')}G.paused=false;closeOv();lastT=performance.now()}}
$('#pitbtn').onclick=()=>{auInit();openPit()};$('#pausebtn').onclick=()=>{auInit();togglePause()};

/* ---------- END / RESULTS ---------- */
function endSession(aborted){if(!G||G.ended)return;G.ended=true;G.running=false;
 $('#hud').classList.add('hide');$('#touch').classList.add('hide');$('#topbtns').classList.add('hide');closeOv();if(AU.eg){AU.eg.gain.value=0;AU.og.gain.value=0;AU.sg.gain.value=0;AU.rg.gain.value=0}
 if(G.mode==='tt'){const k='kgp_tt_'+G.cls+'_'+G.key,old=store.get(k,Infinity),b=G.player.best;let rec=false;if(b<old){store.set(k,b);rec=true}
  return showMenu('<div class="wrap"><h2>Ennätysajo: '+G.T.name+'</h2><p class="sub">Paras kierros '+fmt(b)+(rec?' – uusi ennätys!':' (ennätys '+fmt(old)+')')+'</p><div class="row"><button class="btn go" id="again"><span>Aja uudestaan</span></button><button class="btn" id="home">Päävalikko</button></div></div>',()=>{$('#again').onclick=()=>startTT(G.key);$('#home').onclick=home})}
 if(G.mode==='quali'){W8.pBest=G.player.best;return gridScreen()}
 // race results
 const ord=G.order,L=ord[0],pts=G.C.pts;const res=ord.map((c,i)=>{let gap;if(c.state==='out')gap='Keskeytti';else if(i===0)gap=fmt(c.finishT);else if(c.done)gap='+'+(c.finishT-L.finishT).toFixed(3);else{const dp=L.lap-c.lap;gap=dp>=1?'+'+dp+' kierr.':'+'+((L.prog-c.prog)*G.T.step/420+ (G.t-L.finishT||0)).toFixed(1)}
  return{name:c.name,team:c.team,col:c.col,isP:c.isP,gap,best:c.best,pts:c.state==='out'?0:(pts[i]||0)}});
 let seasonHtml='';if(W8.type==='season'){const sn=store.get('kgp_season_'+G.cls,null);if(sn){res.forEach(r=>{sn.pts[r.name]=(sn.pts[r.name]||0)+r.pts});sn.done[sn.round]={pos:res.findIndex(r=>r.isP)+1};sn.round++;store.set('kgp_season_'+G.cls,sn)}}
 const pPos=res.findIndex(r=>r.isP)+1;

function resTable(res){return'<table><tr><th>#</th><th>Kuljettaja</th><th>Talli</th><th class="n">Aika</th><th class="n">Paras</th><th class="n">Pist.</th></tr>'+res.map((r,i)=>'<tr'+(r.isP?' class="me"':'')+'><td>'+(i+1)+'</td><td><span class="dot" style="background:'+r.col+'"></span>'+r.name+'</td><td>'+r.team+'</td><td class="n">'+r.gap+'</td><td class="n">'+fmt(r.best)+'</td><td class="n">'+r.pts+'</td></tr>').join('')+'</table>'}

/* ---------- MENUS ---------- */
function showMenu(html,bind){const m=$('#menu');m.classList.remove('hide');m.innerHTML=html;m.scrollTop=0;bind&&bind();
 m.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const k=b.dataset.k,v=b.dataset.v;S[k]=isNaN(+v)?(v==='true'?true:v==='false'?false:v):+v;saveS();if(k==='sound')setSound(S.sound);home()})}
function seg(k,opts){return'<div class="seg">'+opts.map(([v,l])=>'<button data-k="'+k+'" data-v="'+v+'" class="'+(String(S[k])===String(v)?'on':'')+'">'+l+'</button>').join('')+'</div>'}
function home(){G=null;
 showMenu('<div class="wrap"><div class="logo"><span class="stripe"></span>Kauden GP</div><p class="sub">Koko kauden kisat, sade, varikot ja turva-auto. Autot tai moottoripyörät.</p>'+
 '<h3>Sarja</h3>'+seg('cls',[['f','Formula-autot'],['m','Moottoripyörät']])+
 '<h3>Kuljettajan nimi</h3><input type="text" id="pname" maxlength="18" value="'+(S.name||'').replace(/"/g,'')+'">'+
 '<h3>Vaikeustaso</h3>'+seg('diff',[[0,'Helppo'],[1,'Normaali'],[2,'Vaikea']])+
 '<h3>Kierroksia kisassa</h3>'+seg('laps',[[3,'3'],[5,'5'],[8,'8'],[12,'12']])+
 '<h3>Asetukset</h3>'+seg('auto',[[false,'Kaasu itse'],[true,'Automaattikaasu']])+seg('sound',[[true,'Äänet päällä'],[false,'Äänet pois']])+
 '<h3>Pelimuoto</h3><div class="modes"><button class="mode" id="mSeason"><b>Kausi</b><small>'+CAL[S.cls].length+' osakilpailua, pisteet ja mestaruus</small></button><button class="mode" id="mSingle"><b>Yksittäinen kisa</b><small>Valitse rata, aika-ajo ja kilpailu</small></button><button class="mode" id="mTT"><b>Ennätysajo</b><small>Yksin radalla, paras kierrosaika talteen</small></button></div>'+
 '<p class="note" style="margin-top:20px">Tietokoneella: nuolet tai WASD, välilyönti jarruttaa, P varikko, C vaihtaa kameraa, Esc tauko. Tabletilla ohjaimet ovat ruudulla.</p></div>',
 ()=>{const pn=$('#pname');pn.oninput=()=>{S.name=pn.value.trim()||'Pelaaja';saveS()};
  $('#mSeason').onclick=()=>{auInit();seasonScreen()};$('#mSingle').onclick=()=>{auInit();pickTrack('single')};$('#mTT').onclick=()=>{auInit();pickTrack('tt')}})}
function calGrid(keys,cls,cb,sn){return'<div class="cal">'+keys.map((k,i)=>{const T=TR[k],d=sn&&sn.done[i],nx=sn&&sn.round===i;const rec=store.get('kgp_tt_'+cls+'_'+k,null);
 return'<button data-tk="'+k+'" class="'+(d?'done':'')+(nx?' next':'')+'"'+(sn&&!nx?' disabled':'')+'><b>'+(i+1)+'. '+T.n+'</b><small>'+(d?'Sija '+d.pos:'Sateen todennäköisyys '+Math.round(T.rain*100)+' %')+(rec&&!sn?'<br>Ennätys '+fmt(rec):'')+'</small></button>'}).join('')+'</div>'}

function startTT(k){W8={type:'tt',key:k};startSession('tt',k,null,'S')}
function standings(sn){const all=roster(S.cls);return all.map(d=>({...d,pts:sn.pts[d.name]||0})).sort((a,b)=>b.pts-a.pts)}
function seasonScreen(){let sn=store.get('kgp_season_'+S.cls,null);const cal=CAL[S.cls];
 if(!sn){sn={round:0,pts:{},done:{}};store.set('kgp_season_'+S.cls,sn)}
 const st=standings(sn),over=sn.round>=cal.length;

 '<h3>Sarjataulukko</h3><table><tr><th>#</th><th>Kuljettaja</th><th>Talli</th><th class="n">Pisteet</th></tr>'+st.map((d,i)=>'<tr'+(d.isP?' class="me"':'')+'><td>'+(i+1)+'</td><td><span class="dot" style="background:'+d.col+'"></span>'+d.name+'</td><td>'+d.team+'</td><td class="n">'+d.pts+'</td></tr>').join('')+'</table></div>',
 ()=>{$('#back').onclick=home;$('#reset').onclick=()=>{if(confirm('Aloitetaanko uusi kausi? Nykyiset pisteet nollataan.')){store.set('kgp_season_'+S.cls,null);seasonScreen()}};if(!over)$('#go').onclick=()=>weekend('season',cal[sn.round])})}
function weekend(type,key){const T=getTrack(key),C=CLS[S.cls],prof=makeProfile(T,C);
 W8={type,key,qWet:Math.random()<T.rain*.7?rnd(.4,.8):0,prof};

 ()=>{$('#q').onclick=()=>startSession('quali',key,null,W8.qWet>.5?'W':W8.qWet?(S.cls==='f'?'I':'W'):'S');$('#skip').onclick=()=>{W8.pBest=Infinity;gridScreen()};$('#back').onclick=type==='season'?seasonScreen:()=>pickTrack('single')})}
function gridScreen(){const P=roster(S.cls).find(d=>d.isP);const rows=W8.qAI.concat([{code:'SIN',name:P.name,col:P.col,d:P,t:W8.pBest,isP:1}]).sort((a,b)=>a.t-b.t);W8.grid=rows.map(r=>r.d);
 const pp=rows.findIndex(r=>r.isP)+1;let sel=CLS[S.cls].tyres.includes('M')?'M':'S';
 const draw=()=>showMenu('<div class="wrap"><h2>Lähtöruudukko</h2><p class="sub">Lähdet ruudusta '+pp+'. '+(pp===1?'Paalupaikka!':'')+'</p><table><tr><th>#</th><th>Kuljettaja</th><th class="n">Aika</th></tr>'+rows.map((r,i)=>'<tr'+(r.isP?' class="me"':'')+'><td>'+(i+1)+'</td><td><span class="dot" style="background:'+r.col+'"></span>'+r.name+'</td><td class="n">'+fmt(r.t)+'</td></tr>').join('')+'</table>'+
  '<h3>Lähtörenkaat</h3><div class="seg">'+CLS[S.cls].tyres.map(t=>'<button data-ty="'+t+'" class="tyrebtn'+(t===sel?' on':'')+'"><span class="tyre" style="border-color:'+TY[t].col+'">'+t+'</span>'+TY[t].n+'</button>').join('')+'</div><p class="note">Pehmeät ovat nopeimmat mutta kuluvat nopeasti. Märällä radalla tarvitset sade- tai välikelin renkaat. Rengasrikko tai kulunut rengas hidastaa, joten käy varikolla P-napista.</p>'+
  '<div class="row"><button class="btn go" id="race"><span>Kilpailuun ('+S.laps+' kierrosta)</span></button></div></div>',()=>{document.querySelectorAll('[data-ty]').forEach(b=>b.onclick=()=>{sel=b.dataset.ty;draw()});$('#race').onclick=()=>startSession('race',W8.key,W8.grid,sel)});draw()}

init3D();requestAnimationFrame(loop);home();

</script>
