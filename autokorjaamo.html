<style>
:root{
  --bg:#d9d6cf; --wall:#4f6b58; --wall-ink:#eef0e6; --paper:#f6f1e1; --ink:#2a2723; --muted:#6d675d;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1f2321; --wall:#2e4236; --wall-ink:#e3e8dc; --paper:#2c2a25; --ink:#ece6d6; --muted:#a49d8e;

:root[data-theme="dark"]{--bg:#1f2321;--wall:#2e4236;--wall-ink:#e3e8dc;--paper:#2c2a25;--ink:#ece6d6;--muted:#a49d8e;--yellow:#e8b923;--rust:#d27552;--ok:#6fb479;--line:#46423a;--panel:#262522;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Bitter,Georgia,serif;font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--wall)}
.sign{background:var(--wall);color:var(--wall-ink);padding:14px 16px 10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;border-bottom:6px solid var(--yellow)}
.sign h1{margin:0;font-family:"Saira Condensed",Impact,sans-serif;font-weight:800;font-size:clamp(26px,7vw,40px);line-height:1;letter-spacing:.01em}
.sign h1 small{display:block;font-weight:500;font-size:.5em;opacity:.8;letter-spacing:.06em}
.gauges{display:flex;gap:14px;margin-top:8px;font-family:"Saira Condensed",sans-serif;font-size:19px;font-weight:700;flex-wrap:wrap}
.gauges span b{color:var(--yellow)}
nav{display:flex;gap:6px;margin-top:10px}
nav button{flex:1;font-family:"Saira Condensed",sans-serif;font-weight:700;font-size:18px;padding:8px 4px;border:0;border-radius:4px 4px 0 0;background:rgba(255,255,255,.12);color:var(--wall-ink);cursor:pointer}
nav button[aria-pressed="true"]{background:var(--yellow);color:#2a2723}
main{max-width:720px;margin:0 auto;padding:16px 14px 40px}
button{font:inherit}
button:focus-visible{outline:3px solid var(--rust);outline-offset:2px}
.ari{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border-left:5px solid var(--yellow);padding:10px 12px;margin-bottom:14px;font-style:italic}
.ari strong{font-style:normal;font-family:"Saira Condensed",sans-serif;font-size:18px}
.queue{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.order{background:var(--paper);border:1px solid var(--line);padding:10px;text-align:left;cursor:pointer;color:var(--ink);position:relative;box-shadow:2px 3px 0 var(--line)}
.order[aria-pressed="true"]{outline:3px solid var(--yellow)}
.order .no{font-family:"Saira Condensed",sans-serif;color:var(--rust);font-weight:700}
.order .car{font-weight:600;display:block}
.order .who{font-size:14px;color:var(--muted)}
.order.done{opacity:.55}
.stamp{position:absolute;right:8px;top:6px;transform:rotate(-8deg);font-family:"Saira Condensed",sans-serif;font-weight:800;color:var(--ok);border:2px solid var(--ok);padding:0 5px;font-size:14px}
.stamp.wait{color:var(--muted);border-color:var(--muted)}
.stamp.gone{color:var(--rust);border-color:var(--rust)}
.job{background:var(--paper);border:1px solid var(--line);padding:16px;box-shadow:3px 4px 0 var(--line)}
.job h2{font-family:"Saira Condensed",sans-serif;margin:0;font-size:26px;line-height:1.1}
.job .complaint{font-size:18px;margin:6px 0 4px}
.job svg{width:100%;max-width:300px;display:block;margin:6px auto}
h3{font-family:"Saira Condensed",sans-serif;font-size:20px;margin:16px 0 6px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.tool{background:var(--panel);color:var(--ink);border:1px solid var(--line);padding:8px 10px;border-radius:3px;cursor:pointer;text-align:left}
.tool small{color:var(--muted);display:block;font-size:13px}
.tool[aria-pressed="true"]{border-color:var(--yellow);border-width:2px}
.big:disabled{opacity:.45;cursor:not-allowed}
.tool:disabled{opacity:.45;cursor:not-allowed}
.tool.fix{border-left:4px solid var(--rust)}
.log{list-style:none;padding:0;margin:0;font-size:15px}
.log li{border-bottom:1px dashed var(--line);padding:5px 0}
.log b{font-family:"Saira Condensed",sans-serif;font-size:16px}
.big{display:block;width:100%;margin-top:16px;padding:12px;font-family:"Saira Condensed",sans-serif;font-weight:800;font-size:22px;background:var(--yellow);color:#2a2723;border:0;border-radius:4px;cursor:pointer}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.shop .item{display:flex;justify-content:space-between;gap:12px;align-items:center;background:var(--paper);border:1px solid var(--line);padding:12px;margin-bottom:10px}
.shop .item p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.shop .item b{font-family:"Saira Condensed",sans-serif;font-size:19px}
.buy{background:var(--wall);color:var(--wall-ink);border:0;padding:8px 14px;border-radius:3px;cursor:pointer;font-family:"Saira Condensed",sans-serif;font-size:18px;white-space:nowrap}
.buy:disabled{opacity:.4;cursor:not-allowed}
.owned{font-family:"Saira Condensed",sans-serif;color:var(--ok);font-weight:700;font-size:18px}
.bar{height:12px;background:var(--panel);border:1px solid var(--line);margin:8px 0 14px}
.bar i{display:block;height:100%;background:var(--yellow)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.card{background:var(--paper);color:var(--ink);max-width:420px;width:100%;padding:20px;border-top:8px solid var(--yellow)}
.card h2{font-family:"Saira Condensed",sans-serif;margin:0 0 8px;font-size:28px}
.reset{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;margin-top:24px;font-size:14px}
@media (prefers-reduced-motion:no-preference){.order[aria-pressed="true"]{transform:translateY(-2px);transition:transform .15s}}
#hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;padding:8px 12px;font-family:"Saira Condensed",sans-serif;font-weight:800;font-size:22px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7);pointer-events:none}
#gmsg{position:absolute;left:12px;right:12px;bottom:12px;background:rgba(0,0,0,.6);color:#fff;padding:10px 12px;font-size:15px;pointer-events:none}
.steer{display:flex;gap:10px;margin-top:10px}.steer button{flex:1;margin:0;font-size:30px;padding:16px;touch-action:none;user-select:none;-webkit-user-select:none}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

}

const slots=()=>2+(S.up.halli1?1:0)+(S.up.halli2?1:0);
const inHall=()=>S.queue.filter(q=>q.status==="hall"||q.status==="waiting").length;
const isOpen=q=>["queue","hall","waiting"].includes(q.status);
function patience(q){return Math.max(1,(S.up.kahvi?3:2)+(q.extra||0))}
function speed(t){return Math.round(t*(S.up.apu?0.7:1)*(S.slow?1.3:1)*(S.mood==="huono"?1.15:1))}
function testTime(id){let t=TESTS[id].t;if(id==="alusta"&&S.up.nostin)t=15;return speed(t)}
function fixTime(o){return speed(o.tire&&S.up.nostin?15:o.rt)}
const partCost=(o,used)=>used?Math.round(o.part*0.5):o.part;
const needsOrder=(o,used)=>!used&&o.part>=150;

function makeJob(faults,kind,used,extra={}){
  let reg=null;
  if(kind!=="takuu"&&kind!=="kolari"&&Math.random()<0.4){const c=REGULARS.filter(r=>!used.has(r.id));if(c.length){reg=pick(c);used.add(reg.id)}}
  const car=pick(CARS),f0=F(faults[0]);
  const others=shuffle(FAULTS.filter(x=>!faults.includes(x.id)&&!x.x)).slice(0,kind==="katsastus"?3:4).map(x=>x.id);
  const job={no:S.day*100+S.queue.length+1,car:reg?reg.car:car[0],year:reg?reg.year:car[1]+Math.floor(Math.random()*3),color:reg?reg.color:pick(COLORS),
    who:reg?reg.n:pick(NAMES),reg:reg?reg.id:null,extra:reg?reg.pat:0,mult:reg?reg.mult:1,kind,c:f0.c,
    faults,fixed:[],log:[],tested:[],wrong:0,status:"queue",opts:f0.tire?faults.slice():shuffle([...faults,...others]),...extra};
  if(kind==="normal"&&Math.random()<0.2)job.upsell=pick(UPSELLS);
  if(kind==="katsastus")job.c="Katsastus on ylihuomenna. Käykää auto läpi, ettei tule hylkäystä. "+"Itse huomasin: "+f0.c.toLowerCase();
  if(reg&&reg.hint&&!f0.tire){const k=Object.keys(f0.r)[0];job.tested.push(k);job.log.push(`<b>Eskon muistiinpano (${TESTS[k].n}):</b> ${f0.r[k]}`)}
  return job;
}

function newDay(){
  const carry=S.queue.filter(q=>q.status==="hall"||q.status==="waiting");
  carry.forEach(q=>{if(q.status==="waiting"){q.status="hall";q.arrived=true;q.log.push("<b>Aamu:</b> tilattu osa saapui.")}else q.log.push("<b>Aamu:</b> auto oli hallissa yön yli.")});
  S.queue=carry;S.cur=null;S.summary=null;S.event=null;S.noObd=false;S.slow=false;S.time=480;S.earned=0;
  const sea=season(S.day),tireDay=(sea==="syksy"||sea==="kevät")&&(S.day-1)%7===5;
  const used=new Set(carry.map(q=>q.reg).filter(Boolean));
  let n=Math.min(7,Math.max(3,Math.round(1+S.rep)));
  // takuu
  S.comebacks.filter(c=>c.day<=S.day).forEach(c=>{
    S.queue.push(makeJob([c.f],"takuu",used,{car:c.car,year:c.year,color:c.color,who:c.who,reg:c.reg,mult:0,extra:0,c:"Sama vika palasi! Purkuosa ei kestänyt. Takuuseen, kiitos."}));n--;});
  S.comebacks=S.comebacks.filter(c=>c.day>S.day);
  // event
  let ari=pick(QUIPS.start);
  if(tireDay){ari=sea==="syksy"?"Ensilumi tuli yöllä. Puoli Porvoota haluaa talvirenkaat alle tänään!":"Lumet suli. Nyt kaikki haluaa kesärenkaat alle!";S.event="Rengassesonki"}
  else if(S.day>2&&Math.random()<0.35){
    const ev=pick(["hinaus","toimittaja","katko","flunssa"]);
    if(ev==="hinaus"){S.queue.push(makeJob(["kolari"],"kolari",used));n--;S.event="Kolariauto";ari="Hinausauto peruutti pihaan aamukuudelta. Isompi homma, isompi lasku."}
    if(ev==="toimittaja"){S.event="Toimittaja";S.reporter=true;ari="Paikallislehden toimittaja tulee tänään asiakkaaksi. Yksi auto on hänen – hoidetaan se hyvin."}
    if(ev==="katko"){S.event="Sähkökatko";S.noObd=true;ari="Sähköt poikki koko korttelista. OBD-lukija on pimeänä, mennään korvakuulolla."}
    if(ev==="flunssa"){S.event="Ari flunssassa";if(S.up.apu){S.slow=true;ari="Ari on flunssassa. Kalle hoitaa päivän yksin, vähän hitaammin."}else{S.time=600;ari="Ari on flunssassa ja pääsi verstaalle vasta kymmeneltä."}}
  }
  // katsastus
  if(Math.random()<0.45&&n>1){const pool=shuffle(FAULTS.filter(f=>f.k));S.queue.push(makeJob(pool.slice(0,2+Math.floor(Math.random()*2)).map(f=>f.id),"katsastus",used));n--}
  const pool=[];FAULTS.filter(f=>!f.x).forEach(f=>{pool.push(f);if(f.s===sea){pool.push(f,f)}});
  for(let i=0;i<n;i++)S.queue.push(makeJob([pick(pool).id],"normal",used));
  if(tireDay)for(let j=0;j<4;j++){const q=makeJob(["renkaat"],"tire",used);q.c=sea==="syksy"?"Talvirenkaat alle, kiitos!":"Kesärenkaat alle, kiitos!";S.queue.push(q)}
  if(S.reporter){const c=S.queue.filter(q=>q.kind==="normal"&&!q.reg);if(c.length){const r=pick(c);r.reporter=true;r.who="Toimittaja "+r.who}S.reporter=false}
  if(S.rep<2.5){const c=S.queue.filter(q=>q.kind==="normal"&&q.status==="queue"&&!q.carried&&!q.reg);if(c.length>2){S.queue.splice(S.queue.indexOf(pick(c)),1);ari+=" Turbo-Tom kadun toisella puolella vei taas yhden asiakkaan."}}
  else if(S.rep>=3.5&&Math.random()<0.3){const t=makeJob([pick(["kytkin","pumppu","hehku","laakeri","vesipumppu"])],"normal",used,{tom:true,reg:null,extra:0,mult:1.3});t.who="Turbo-Tomin lähettämä";S.queue.push(t);ari+=" Turbo-Tom soitti: hänellä on auto, jota ei osaa korjata."}
  S.mood=pick(["hyvä","normaali","normaali","huono"]);
  if(S.mood==="hyvä")ari+=" Ari viheltelee. Hyvä päivä, asiakkaat maksavat vähän reilummin.";
  if(S.mood==="huono")ari+=" Ari on yrmeänä aamulla. Kaikki käy tänään vähän hitaammin.";
  S.fleaMsg=null;if(isSat())ari+=" Lauantai: kirppis on auki verstaalla.";
  S.queue.forEach((q,i)=>q.no=S.day*100+i+1);
  S.ari=ari;
}

const clock=m=>`${String(Math.floor(m/60)).padStart(2,"0")}.${String(m%60).padStart(2,"0")}`;
const stars=r=>{r=Math.round(r);return "★".repeat(r)+"☆".repeat(5-r)};
function review(q,type,st){S.reviews.unshift({who:q.who,st,t:pick(REVIEWS[type])});S.reviews=S.reviews.slice(0,5)}

function complete(q,passed){
  let pay=Math.round(q.fixed.reduce((s,id)=>s+F(id).pay,0)*q.mult);
  if(q.kind==="katsastus"&&passed)pay+=80;
  if(q.reg&&q.mult>0)pay+=REG(q.reg).tip;pay+=q.bonus||0;if(S.mood==="hyvä")pay=Math.round(pay*1.1);
  S.money+=pay;S.earned+=pay;
  if(q.kind==="katsastus"&&!passed){q.status="failed";S.rep=Math.max(1,S.rep-0.5);review(q,"fail",1);q.log.push(`<b>Katsastus:</b> hylätty. Asiakas maksoi tehdyistä töistä ${pay} €.`);S.ari="Hylky. Jotain jäi huomaamatta.";return}
  q.status="done";S.rep=Math.min(5,S.rep+(q.wrong?0.1:0.3));stat("fixed");if(q.wrong)S.st.streak=0;else{stat("streak");S.st.bestStreak=Math.max(S.st.bestStreak||0,S.st.streak)}if(q.kind==="katsastus")stat("kats");if(q.reg==="raili")stat("pulla");if(q.tom)stat("tom");
  if(q.reporter){S.rep=Math.min(5,S.rep+0.8);S.reviews.unshift({who:"Uusimaa-lehti",st:5,t:"Arin korjaamo on Porvoon rehellisin paja."});S.ari="Lehteen tulee hyvä juttu!"}
  else if(q.kind==="takuu")review(q,"takuu",4);
  else review(q,q.wrong?"ok":"good",q.wrong?3:5);
  q.log.push(`<b>Valmis:</b> ${q.kind==="takuu"?"takuutyö, ei laskua.":`asiakas maksoi ${pay} €.`}${q.reg==="raili"?" Ja jätti pullaa kahvihuoneeseen.":""}${q.kind==="katsastus"?" Katsastus meni läpi!":""}`);
}
function leave(q,type){
  q.status="gone";S.st.streak=0;S.rep=Math.max(1,S.rep-(q.kind==="takuu"?0.6:0.3));
  if(q.reporter){S.rep=Math.max(1,S.rep-1);S.reviews.unshift({who:"Uusimaa-lehti",st:1,t:"Korjaamolla arvattiin, asiakas maksoi."})}
  else review(q,type,1);
  S.reviews=S.reviews.slice(0,5);
}
function repair(q,o,used,fac=1){
  S.time+=Math.round(fixTime(o)*fac);
  if(q.faults.includes(o.id)&&!q.fixed.includes(o.id)){
    q.fixed.push(o.id);q.opts=q.opts.filter(x=>x!==o.id);
    q.log.push(`<b>${o.fix}${used?" (käytetty osa)":""}:</b> ${q.kind==="katsastus"?"korjattu.":"vika poistui."}`);
    if(used&&Math.random()<0.35)S.comebacks.push({day:S.day+3+Math.floor(Math.random()*3),f:o.id,car:q.car,year:q.year,color:q.color,who:q.who,reg:q.reg});
    if(q.kind!=="katsastus"&&q.fixed.length===q.faults.length){complete(q,true);if(!q.reporter)S.ari=pick(QUIPS.right)}
    else S.ari="Yksi kunnossa. Onkohan muuta?";
  }else{
    q.wrong++;q.opts=q.opts.filter(x=>x!==o.id);S.rep=Math.max(1,S.rep-0.2);
    q.log.push(`<b>${o.fix}:</b> ei auttanut. Osa jäi hyllyyn ylijäämäksi.`);S.spares++;S.ari=pick(QUIPS.wrong);
    if(q.wrong>=patience(q)){leave(q,"bad");S.ari=pick(QUIPS.gone)}
  }
}

function render(){
  document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.tab===S.tab));
  document.getElementById("gauges").innerHTML=`<span>${["Ma","Ti","Ke","To","Pe","La","Su"][(S.day-1)%7]} <b>${S.day}</b> · ${cap(season(S.day))}</span><span>Kello <b>${clock(S.time)}</b></span><span>Kassa <b>${S.money} €</b></span><span>Halli <b>${inHall()}/${slots()}</b></span><span title="Maine">${stars(S.rep)}</span>${S.event?`<span><b>${S.event}</b></span>`:""}`;
  const app=document.getElementById("app");
  app.innerHTML=S.tab==="korjaamo"?korjaamo():S.tab==="verstas"?verstas():S.tab==="ajo"?ajopeli():kauppa();
  setTimeout(mount3d,0);
  modal();save();
}

const STAMP={done:["VALMIS",""],gone:["LÄHTI","gone"],failed:["HYLÄTTY","gone"],waiting:["OSA TILATTU","wait"],hall:["HALLISSA","wait"]};
const KIND={katsastus:" · katsastus",tire:" · renkaat",takuu:" · takuutyö",kolari:" · kolari"};

function korjaamo(){
  let h=`<div class="ari"><div><strong>Ari:</strong> ${S.ari}</div></div>`;
  h+=`<div class="queue">`+S.queue.map((q,i)=>{const st=STAMP[q.status];return `<button class="order ${["done","gone","failed"].includes(q.status)?"done":""}" data-act="sel" data-i="${i}" aria-pressed="${S.cur===i}">
    <span class="no">Työmääräin ${q.no}</span><span class="car">${q.car}</span><span class="who">${q.who}${q.reg?" · vakioasiakas":""}${KIND[q.kind]||""}</span>
    ${st?`<span class="stamp ${st[1]}">${st[0]}</span>`:""}</button>`}).join("")+`</div>`;
  const q=S.queue[S.cur],closed=S.time>=960;
  if(!q)h+=`<div class="empty">${closed?"Kello on neljä, verstas sulkeutuu.":"Valitse työmääräin jonosta ja ota auto halliin."}</div>`;
  else h+=job(q,closed);
  const anyOpen=S.queue.some(x=>x.status==="queue"||x.status==="hall");
  h+=(closed||!anyOpen)?`<button class="big" data-act="endday">Sulje verstas ja laske päivän kassa</button>`:`<button class="tool" style="margin-top:16px" data-act="endday">Lopeta päivä aikaisin</button>`;
  if(S.reviews.length)h+=`<h3>Asiakasarviot</h3><ul class="log">${S.reviews.map(r=>`<li><b>${stars(r.st)}</b> ”${r.t}” – ${r.who}</li>`).join("")}</ul>`;
  return h;
}

function job(q,closed){
  const f0=F(q.faults[0]);
  let h=`<section class="job"><h2>${q.car} · ${q.who}</h2>${carSvg(q.color)}<p class="complaint">”${q.c}”</p>`;
  const notes=[];
  if(q.reg)notes.push(REG(q.reg).line);if(q.tom)notes.push("Turbo-Tom ei saanut tätä korjattua ja lähetti sen Arille. Maksaa 30 % enemmän.");if(q.upsell&&!q.bonus)notes.push(`Asiakas kysyi: ”Voisitko samalla tehdä ${q.upsell.n.toLowerCase()}?”`);
  if(q.kind==="katsastus")notes.push("Vikoja voi olla useampi. Etsi ne testeillä ja vie auto katsastukseen, kun luulet kaiken olevan kunnossa. Katsastukseen mennyt auto tuo 80 € bonuksen.");
  if(q.kind==="takuu")notes.push("Takuutyö: ei laskua, mutta jos et hoida sitä, maine kärsii pahasti.");
  if(q.reporter)notes.push("Toimittaja seuraa työtä. Hyvä työ nostaa mainetta paljon, huono laskee sitä.");
  notes.forEach(n=>h+=`<p style="font-size:14px;color:var(--muted);margin:4px 0">${n}</p>`);
  if(q.status==="queue"){
    const full=inHall()>=slots();
    h+=`<button class="big" data-act="inhall" ${full||closed?"disabled":""}>Ota auto halliin</button>${full?`<p style="font-size:14px;color:var(--rust)">Halli on täynnä. Valmista ensin jokin auto tai osta lisähallipaikka.</p>`:""}`;
  }
  if(q.status==="hall"&&!f0.tire){
    h+=`<button class="tool" data-act="hood" style="margin-top:10px" ${closed?"disabled":""}>Avaa konepelti (3D)<small>napauta osia, 5 min / osa</small></button><h3>Tutki</h3><div class="btns">`+Object.entries(TESTS).map(([id,t])=>{
      const locked=t.req&&(!S.up[t.req]||S.noObd);const done=q.tested.includes(id);
      return `<button class="tool" data-act="test" data-t="${id}" ${locked||closed?"disabled":""}>${t.n}<small>${locked?(S.noObd&&S.up.obd?"Sähkökatko":"Vaatii OBD-lukijan"):(done?"Uudelleen, ":"")+testTime(id)+" min"}</small></button>`}).join("")+`</div>`;
  }
  if(q.log.length)h+=`<h3>Havainnot</h3><ul class="log">${q.log.map(l=>`<li>${l}</li>`).join("")}</ul>`;
  if(q.status==="waiting")h+=`<p><em>Osa on tilattu ja saapuu huomenna aamulla. Auto pitää hallipaikan siihen asti.</em></p>`;
  if(q.status==="hall"){
    if(q.upsell&&!q.bonus)h+=`<button class="tool" data-act="upsell" style="margin-top:12px" ${closed?"disabled":""}>Lisätyö: ${q.upsell.n}<small>+${q.upsell.pay} € laskuun · ${speed(q.upsell.t)} min · tee ennen viimeistä korjausta</small></button>`;
    if(q.order&&q.arrived){const o=F(q.order);h+=`<button class="big" data-act="install" ${closed?"disabled":""}>Asenna tilattu osa: ${o.fix} (${fixTime(o)} min)</button>`}
    else{
      h+=`<h3>Korjaa</h3>`;
      if(!f0.tire)h+=`<div class="btns" style="margin-bottom:8px"><button class="tool" data-act="used" aria-pressed="${S.used}">${S.used?"Käytetyt osat purkaamolta":"Uudet osat"}<small>${S.used?"puoleen hintaan heti, mutta vika voi palata":"täysi hinta, kalliit osat tilataan huomiseksi"} · vaihda</small></button></div>`;
      h+=`<div class="btns">`+q.opts.filter(id=>!q.fixed.includes(id)).map(id=>{const o=F(id),u=S.used&&!o.tire,c=partCost(o,u);
        return `<button class="tool fix" data-act="fix" data-f="${id}" ${S.money<c||closed?"disabled":""}>${o.fix}<small>${c?`osa ${c} € · `:""}${needsOrder(o,u)?"tilaus, huomenna":fixTime(o)+" min"}</small></button>`}).join("")+`</div>`;
      if(q.kind==="katsastus")h+=`<button class="big" data-act="inspect" ${closed?"disabled":""}>Vie katsastukseen</button>`;
    }
    if(!f0.tire)h+=`<p style="font-size:14px;color:var(--muted)">Vääriä korjauksia jäljellä ennen kuin asiakas lähtee: ${patience(q)-q.wrong}</p>`;
  }
  return h+`</section>`;
}

function verstasMain(){
  const P=PROJECTS[S.projIdx];
  if(!P)return `<div class="ari"><div><strong>Ari:</strong> Saab, Amazon ja Massikka – kaikki valmiina. Hylly on täynnä pokaaleja. Korjaamo pyörii silti.</div></div>`;
  const done=P.parts.filter(p=>S.proj[p[0]]).length;
  let h=`<div class="ari"><div><strong>Ari:</strong> ${done===0?P.intro:done<6?`${done}/6 valmiina. Vielä vähän.`:"Valmis on!"}</div></div>`;
  h+=`<section class="job"><h2>${P.n}</h2><div id="v3d" data-color="${S.proj.maali?P.paint:P.base}" style="height:230px;touch-action:none;cursor:grab">${carSvg(S.proj.maali?P.paint:P.base)}</div><p style="font-size:13px;color:var(--muted);margin:0">Pyöritä autoa vetämällä.</p><div class="bar"><i style="width:${done/6*100}%"></i></div><p style="font-size:14px;color:var(--muted)">Projekti ${S.projIdx+1}/3</p></section><div class="shop" style="margin-top:14px">`;
  h+=P.parts.map(([id,n,p])=>`<div class="item"><div><b>${n}</b></div>${S.proj[id]?'<span class="owned">Tehty</span>':`<button class="buy" data-act="proj" data-p="${id}" ${S.money<p?"disabled":""}>${p} €</button>`}</div>`).join("")+`</div>`;
  if(done===6)h+=`<button class="big" data-act="race">${P.btn}</button>`;
  return h;
}

function kauppa(){
  let h=`<div class="ari"><div><strong>Ari:</strong> Hyvä työkalu maksaa kerran, huono joka päivä.</div></div><div class="shop">`;
  h+=UPS.map(u=>`<div class="item"><div><b>${u.n}</b><p>${u.d}</p></div>${S.up[u.id]?'<span class="owned">Hallissa</span>':`<button class="buy" data-act="up" data-u="${u.id}" ${S.money<u.p||(u.req&&!S.up[u.req])?"disabled":""}>${u.p} €</button>`}</div>`).join("");
  return h+`</div><button class="reset" data-act="reset">Aloita alusta</button>`;
}

     <p><em>Ari: ${s.gone===0&&s.done?"Hyvä päivä. Tällaisia lisää.":s.gone?"Pari jäi kiukuttelemaan. Huomenna paremmin.":"Hiljainen päivä."}</em></p>

document.addEventListener("click",e=>{
  const tab=e.target.closest("[data-tab]");if(tab){S.tab=tab.dataset.tab;render();return}
  const b=e.target.closest("[data-act]");if(!b||b.disabled)return;

  const floor=new THREE.Mesh(new THREE.PlaneGeometry(20,20),M(0x5a5d5f));floor.rotation.x=-Math.PI/2;sc.add(floor);
  const piv=new THREE.Group();piv.position.set(0,0.9,-0.3);const hood=new THREE.Mesh(new THREE.BoxGeometry(1.75,0.05,1.6),M(q.color));hood.position.z=-0.8;piv.add(hood);piv.rotation.x=1.15;car.add(piv);
  const bay=new THREE.Mesh(new THREE.BoxGeometry(1.7,0.05,1.6),M(0x1a1a1a));bay.position.set(0,0.89,-1.15);car.add(bay);
  const parts=[];
  const P=(id,geo,col,x,y,z,rx)=>{const m=new THREE.Mesh(geo,M(col));m.position.set(x,y,z);if(rx)m.rotation.x=rx;m.userData.comp=id;car.add(m);parts.push(m);return m};
  P("akku",new THREE.BoxGeometry(0.4,0.35,0.3),0x222222,-0.6,1.08,-1.5);
  P("moottori",new THREE.BoxGeometry(0.75,0.45,0.7),0x7d8084,0,1.12,-0.85);
  [-0.24,-0.08,0.08,0.24].forEach(x=>P("puolat",new THREE.CylinderGeometry(0.05,0.05,0.18,10),0xb02a2a,x,1.43,-0.85));
  P("laturi",new THREE.CylinderGeometry(0.14,0.14,0.2,16),0xc8c8c8,0.55,1.0,-1.55,Math.PI/2);
  P("jaahdytin",new THREE.BoxGeometry(1.4,0.45,0.08),0x3a3f44,0,1.05,-1.92);
  P("polttoaine",new THREE.CylinderGeometry(0.08,0.08,0.3,12),0x2f4f9a,-0.65,1.05,-0.55);
  P("pakosarja",new THREE.BoxGeometry(0.18,0.3,0.6),0x7a4a2a,0.5,1.02,-0.85);
  P("ac",new THREE.CylinderGeometry(0.12,0.12,0.22,14),0x9aa0a6,-0.25,1.0,-1.62,Math.PI/2);
  const cam=new THREE.PerspectiveCamera(45,el.clientWidth/260,0.1,100);
  let ang=0.25,drag=null,moved=0;
  const place=()=>{cam.position.set(Math.sin(ang)*4.2,3,-Math.cos(ang)*4.2-0.6);cam.lookAt(0,1,-1)};place();
  const ray=new THREE.Raycaster(),v=new THREE.Vector2(),c=R.r.domElement;
  c.onpointerdown=e=>{drag=e.clientX;moved=0;c.setPointerCapture(e.pointerId)};
  c.onpointermove=e=>{if(drag!==null){ang-=(e.clientX-drag)*0.008;moved+=Math.abs(e.clientX-drag);drag=e.clientX;ang=Math.max(-1.2,Math.min(1.2,ang));place()}};
  c.onpointerup=e=>{drag=null;if(moved>6)return;const r=c.getBoundingClientRect();v.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(v,cam);
    const hit=ray.intersectObjects(parts)[0];if(hit){parts.forEach(p=>p.material.emissive&&p.material.emissive.setHex(0));const same=parts.filter(p=>p.userData.comp===hit.object.userData.comp);same.forEach(p=>p.material.emissive.setHex(0x554400));hoodPick(hit.object.userData.comp)}};
  const loop=()=>{R.r.render(sc,cam);R.raf=requestAnimationFrame(loop)};loop();
}
function hoodPick(id){
  const q=S.queue[S.hood];if(!q||S.time>=960)return;
  S.time+=speed(5);
  const res=q.faults.filter(x=>!q.fixed.includes(x)).map(x=>COMP[id].h[x]).filter(Boolean);
  const t=res.length?res.join(" "):"Näyttää ihan normaalilta.";
  q.log.push(`<b>Konepellin alla – ${COMP[id].n}:</b> ${t}`);
  document.getElementById("hoodmsg").innerHTML=`<b>${COMP[id].n}:</b> ${t} <span style="color:var(--muted)">(kello ${clock(S.time)})</span>`;
  save();
}

/* ---------- kiristysminipeli ---------- */
let MP={p:0,d:1,raf:0};
function startMini(q,o,u){S.mini={q:S.queue.indexOf(q),f:o.id,u,n:0,hits:0,z:20+Math.random()*60,w:16}}
function miniHtml(){const m=S.mini,o=F(m.f);return `<div class="overlay"><div class="card" role="dialog" aria-modal="true"><h2>${o.fix}</h2>
  <p>${o.tire?"Kiristä pyöränmutterit":"Kiristä pultit"} oikeaan momenttiin: paina, kun neula on vihreällä. Hyvä työ nopeuttaa asennusta.</p>
  <p style="font-family:'Saira Condensed',sans-serif;font-size:20px">Pultti ${Math.min(m.n+1,3)}/3 · osumia ${m.hits}</p>
  <div style="position:relative;height:38px;background:var(--panel);border:2px solid var(--ink)"><div style="position:absolute;top:0;bottom:0;left:${m.z}%;width:${m.w}%;background:var(--ok)"></div><div id="needle" style="position:absolute;top:-5px;bottom:-5px;width:5px;background:var(--rust);left:${MP.p}%"></div></div>
  <button class="big" data-act="tighten">Kiristä</button></div></div>`}
function startMiniLoop(){cancelAnimationFrame(MP.raf);let last=performance.now();const sp=70+S.mini.n*35;
  const loop=now=>{const dt=Math.min(0.05,(now-last)/1000);last=now;MP.p+=MP.d*sp*dt;if(MP.p>98){MP.p=98;MP.d=-1}if(MP.p<0){MP.p=0;MP.d=1}
    const n=document.getElementById("needle");if(!n||!S.mini)return;n.style.left=MP.p+"%";MP.raf=requestAnimationFrame(loop)};MP.raf=requestAnimationFrame(loop)}
function tighten(){const m=S.mini;const hit=MP.p+2.5>=m.z&&MP.p<=m.z+m.w;m.n++;if(hit)m.hits++;
  if(!hit&&!m.oops&&Math.random()<0.15){const q=S.queue[m.q];if(q&&!q.faults.includes("sahkot")&&!F(m.f).tire){m.oops=1;q.faults.push("sahkot");q.opts.push("sahkot");stat("oops");q.log.push("<b>Voi ei:</b> ruuvi lipsahti väärään paikkaan ja katkaisi auton kaikki sähköt! Tämä korjataan omaan piikkiin.");S.ari=pick(["No niin. Taas meni ruuvi väärään paikkaan. Ei tämä ensimmäinen kerta ole.","Pimeää. Koko auto pimeänä. Ari katsoo ruuvimeisseliä syyttävästi.","Klassikko. Kalle, tuo se johtosarjakaavio."])}}m.z=10+Math.random()*75;m.w=Math.max(8,16-m.n*3);
  if(m.n>=3){const q=S.queue[m.q],o=F(m.f),fac=[1.25,1,0.85,0.7][m.hits];S.mini=null;cancelAnimationFrame(MP.raf);
    if(m.oops)S.ari="Ruuvi katkaisi sähköt. Etsi vika ja korjaa johtosarja ennen kuin asiakas huomaa.";
    q.log.push(`<b>Kiristykset:</b> ${m.hits}/3 oikeaan momenttiin${m.hits===3?", siisti työ.":m.hits===0?", meni vähän sinne päin.":"."}`);repair(q,o,m.u,fac);if(m.hits===3)stat("perfectBolt")}}

/* ---------- pokaalit, kirppis, Tom ---------- */
function stat(k,n=1){S.st[k]=(S.st[k]||0)+n}
const ACH=[
 {id:"eka",n:"Ensimmäinen korjaus",d:"Korjaa yksi auto",c:()=>S.st.fixed>=1},
 {id:"kymppi",n:"Kymmenen autoa",d:"Korjaa 10 autoa",c:()=>S.st.fixed>=10},
 {id:"viiskymppi",n:"Konkari",d:"Korjaa 50 autoa",c:()=>S.st.fixed>=50},
 {id:"putki",n:"Tarkka silmä",d:"5 autoa putkeen ilman väärää arvausta",c:()=>(S.st.bestStreak||0)>=5},
 {id:"kats",n:"Puhtain paperein",d:"Katsastus läpi",c:()=>S.st.kats>=1},
 {id:"momentti",n:"Momenttimestari",d:"Kaikki kolme pulttia oikein 10 kertaa",c:()=>(S.st.perfectBolt||0)>=10},
 {id:"pulla",n:"Pullapäällikkö",d:"Raili toi pullaa 10 kertaa",c:()=>(S.st.pulla||0)>=10},
 {id:"hirvi",n:"Hirvenväistäjä",d:"Väistä 50 hirveä ajopelissä",c:()=>(S.st.moose||0)>=50},
 {id:"kilsa",n:"Kilometritehdas",d:"Aja 1000 m yhdellä kerralla",c:()=>(S.bestDrive||0)>=1000},
 {id:"tom",n:"Tomin pelastaja",d:"Korjaa 3 Turbo-Tomin lähettämää autoa",c:()=>(S.st.tom||0)>=3},
 {id:"kirppis",n:"Kirppiskuningas",d:"Löydä harvinainen osa arvoituslaatikosta",c:()=>(S.st.rare||0)>=1},
 {id:"oops",n:"Taas meni ruuvi väärään paikkaan",d:"Katkaise auton sähköt omalla ruuvilla",c:()=>(S.st.oops||0)>=1},
 {id:"maine",n:"Viiden tähden paja",d:"Nosta maine täyteen",c:()=>S.rep>=4.6},
 {id:"saab",n:"Saab valmis",d:"Saa ensimmäinen projekti valmiiksi",c:()=>S.projIdx>=1},
 {id:"kaikki",n:"Projektimestari",d:"Kaikki kolme projektia valmiina",c:()=>S.projIdx>=3}
];
function checkAch(){ACH.forEach(a=>{if(!S.ach[a.id]&&a.c()){S.ach[a.id]=true;S.ari=`🏆 Uusi pokaali hyllyyn: ${a.n}!`}})}
function shelf(){const got=ACH.filter(a=>S.ach[a.id]).length;return `<h3>Pokaalihylly ${got}/${ACH.length}</h3><div class="btns">`+ACH.map(a=>`<span class="tool" style="cursor:default;${S.ach[a.id]?"border-color:var(--yellow)":"opacity:.45"}">${S.ach[a.id]?"🏆":"🔒"} ${a.n}<small>${a.d}</small></span>`).join("")+`</div>`}
const isSat=()=>(S.day-1)%7===5;
function flea(){
  if(!isSat())return `<p style="font-size:14px;color:var(--muted);margin-top:16px">Hyllyssä ${S.spares} ylijäämäosaa. Kirppis on lauantaisin.</p>`;
  return `<h3>Lauantain kirppis</h3>${S.fleaMsg?`<p><em>${S.fleaMsg}</em></p>`:""}<div class="shop">
   <div class="item"><div><b>Myy ylijäämäosat</b><p>Hyllyssä ${S.spares} osaa, 20 € kappale.</p></div><button class="buy" data-act="sell" ${S.spares?"":"disabled"}>${S.spares*20} €</button></div>
   <div class="item"><div><b>Arvoituslaatikko</b><p>Yksi laatikko per lauantai. Voi olla harvinainen osa, voi olla romua.</p></div><button class="buy" data-act="box" ${S.fleaDay===S.day||S.money<120?"disabled":""}>120 €</button></div></div>`;
}
function openBox(){
  S.money-=120;S.fleaDay=S.day;const r=Math.random(),P=PROJECTS[S.projIdx];
  const left=P?P.parts.filter(p=>!S.proj[p[0]]):[];
  if(r<0.35&&left.length){const p=pick(left);S.proj[p[0]]=true;stat("rare");S.fleaMsg=`Laatikon pohjalta löytyi harvinainen osa! ”${p[1]}” on nyt tehty projektiautoon.`}
  else if(r<0.65){S.spares+=4;S.fleaMsg="Laatikossa oli neljä käyttökelpoista osaa. Ne menivät hyllyyn."}
  else S.fleaMsg=pick(["Laatikossa oli vanhoja Tekniikan Maailmoja ja yksi vasen kumisaapas.","Laatikossa oli 40 kpl samaa sulaketta. Ari huokaisee.","Laatikossa oli kasettisoitin ja Eppu Normaalin kasetti. Ei osa, mutta hyvä löytö."]);
}
const RQ={kimmo:"Taas Kimmo. Laita kahvit tippumaan, se ei kuitenkaan ehdi juoda.",raili:"Raili! Nyt käytöstavat kohdalleen.",esko:"Esko on taas mitannut. Katsotaan mitä insinööri sanoo.",pentti:"Pentti. Älä edes ehdota uutta osaa.",tapsa:"Tapsan taksi. Mittari raksuttaa, joten vauhtia."};
const UPSELLS=[{n:"Pieni viritys",pay:150,t:60},{n:"Iso takaspoileri",pay:120,t:45},{n:"Sävytetyt ikkunat",pay:180,t:70},{n:"Lisävalot keulaan",pay:110,t:40},{n:"Vanteiden maalaus mustaksi",pay:140,t:55}];
function verstas(){return verstasMain()+shelf()+flea()}

document.addEventListener("keydown",e=>{if(S&&S.tab==="ajo"&&G&&G.steer){if(e.key==="ArrowLeft"||e.key==="a"){G.steer(-1);e.preventDefault()}if(e.key==="ArrowRight"||e.key==="d"){G.steer(1);e.preventDefault()}if(e.key===" "&&!G.run){startGame();e.preventDefault()}}});

S=load();
if(!S){S=fresh();newDay()}
else if(!S.migrate&&!S.queue.length)newDay();
S.st=S.st||{};S.ach=S.ach||{};S.spares=S.spares||0;S.mini=null;S.hood=null;
render();
</script>
